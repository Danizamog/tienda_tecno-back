  order-service-tecnoweb:
    build:
      context: ./services/order-service
    container_name: order-service-tecnoweb
    env_file:
      - ./.env
    environment:
      - PORT=9005
    ports:
      - "9005:9005"

  finance-service-tecnoweb:
    build:
      context: ./services/finance-service
    container_name: finance-service-tecnoweb
    env_file:
      - ./.env
    environment:
      - PORT=9006
    ports:
      - "9006:9006"

  wishlist-service-tecnoweb:
    build:
      context: ./services/wishlist-service
    container_name: wishlist-service-tecnoweb
    env_file:
